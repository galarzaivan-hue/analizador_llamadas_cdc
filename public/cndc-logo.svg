<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Shadow Filter -->
    <filter id="cndc-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="12" dy="12" stdDeviation="2" flood-color="#C8D4E2" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 5 Vertical Bars with Shadows -->
  <g id="bars">
    <!-- Bar 1 (Shortest - Yellow) -->
    <path d="M 172 214 L 210 236 L 245 220 L 207 198 Z" fill="#E2E8F0" opacity="0.6"/>
    <rect x="168" y="168" width="13" height="46" rx="6.5" fill="#F3A100" />

    <!-- Bar 2 (Gold Yellow) -->
    <path d="M 195 210 L 235 232 L 270 216 L 230 194 Z" fill="#E2E8F0" opacity="0.6"/>
    <rect x="191" y="128" width="13" height="82" rx="6.5" fill="#F09B00" />

    <!-- Bar 3 (Gold) -->
    <path d="M 218 206 L 260 228 L 295 212 L 253 190 Z" fill="#E2E8F0" opacity="0.6"/>
    <rect x="214" y="90" width="13" height="116" rx="6.5" fill="#EC8C06" />

    <!-- Bar 4 (Orange) -->
    <path d="M 241 202 L 285 224 L 320 208 L 276 186 Z" fill="#E2E8F0" opacity="0.6"/>
    <rect x="237" y="130" width="13" height="72" rx="6.5" fill="#E8771A" />

    <!-- Bar 5 (Deep Orange - Tallest) -->
    <path d="M 264 198 L 310 221 L 345 205 L 299 182 Z" fill="#E2E8F0" opacity="0.6"/>
    <rect x="260" y="52" width="13" height="146" rx="6.5" fill="#E06810" />

    <!-- Bar 6 (Darker Orange Rightmost) -->
    <rect x="283" y="70" width="13" height="102" rx="6.5" fill="#E8771A" />
  </g>

  <!-- CNDC Main Text -->
  <g id="cndc-letters" fill="#005DAA">
    <!-- C 1 -->
    <path d="M 152 232 C 122 232 100 252 100 286 C 100 320 122 340 152 340 C 172 340 186 331 193 318 L 176 308 C 171 316 163 322 152 322 C 134 322 120 308 120 286 C 120 264 134 250 152 250 C 163 250 171 256 176 264 L 193 254 C 186 241 172 232 152 232 Z" />

    <!-- N -->
    <path d="M 206 235 L 206 337 L 225 337 L 271 270 L 271 337 L 291 337 L 291 235 L 272 235 L 226 302 L 226 235 Z" />

    <!-- D with Bolivia Flag Stripe in Spine -->
    <!-- D Outer Curve -->
    <path d="M 302 235 L 302 337 L 345 337 C 378 337 398 316 398 286 C 398 256 378 235 345 235 Z M 322 253 L 342 253 C 365 253 377 266 377 286 C 377 306 365 319 342 319 L 322 319 Z" />
    
    <!-- D Tricolor Flag Spine Insert -->
    <rect x="306" y="272" width="18" height="8" fill="#D52B1E" />
    <rect x="306" y="280" width="18" height="8" fill="#F3A100" />
    <rect x="306" y="288" width="18" height="8" fill="#007A33" />

    <!-- C 2 -->
    <path d="M 452 232 C 422 232 400 252 400 286 C 400 320 422 340 452 340 C 472 340 486 331 493 318 L 476 308 C 471 316 463 322 452 322 C 434 322 420 308 420 286 C 420 264 434 250 452 250 C 463 250 471 256 476 264 L 493 254 C 486 241 472 232 452 232 Z" opacity="0" />
  </g>

  <!-- Subtitle Text -->
  <text x="250" y="375" text-anchor="middle" fill="#005DAA" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" letter-spacing="1.2">
    COMITÉ NACIONAL DE DESPACHO DE CARGA
  </text>
</svg>
